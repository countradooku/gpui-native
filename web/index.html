<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive gpui-native examples running in the browser through WebAssembly and browser GPU rendering."
    />
    <title>gpui-native WebAssembly examples</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #090d14;
        color: #edf3ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      main {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
      }

      main {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
      }

      aside {
        display: flex;
        min-height: 0;
        flex-direction: column;
        border-right: 1px solid #253047;
        background: #0e141f;
      }

      header {
        padding: 24px 20px 18px;
        border-bottom: 1px solid #253047;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 20px;
        letter-spacing: -0.02em;
      }

      header p {
        margin: 0;
        color: #91a0b8;
        font-size: 13px;
        line-height: 1.5;
      }

      nav {
        display: flex;
        min-height: 0;
        flex: 1;
        flex-direction: column;
        gap: 5px;
        overflow-y: auto;
        padding: 12px;
      }

      button {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid transparent;
        border-radius: 9px;
        background: transparent;
        color: #aab6ca;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        text-align: left;
      }

      button:hover {
        background: #182235;
        color: #f2f6ff;
      }

      button[aria-current="true"] {
        border-color: #36517b;
        background: #1c2b42;
        color: #8fbbff;
      }

      footer {
        padding: 14px 20px 18px;
        border-top: 1px solid #253047;
        color: #8290a7;
        font-size: 12px;
        line-height: 1.5;
      }

      a {
        color: #7eafff;
      }

      section {
        display: flex;
        min-width: 0;
        min-height: 0;
        flex-direction: column;
      }

      .toolbar {
        display: flex;
        height: 48px;
        align-items: center;
        gap: 10px;
        padding: 0 16px;
        border-bottom: 1px solid #253047;
        background: #0b1018;
        color: #91a0b8;
        font-size: 13px;
      }

      .toolbar strong {
        color: #e8effc;
      }

      .toolbar a {
        margin-left: auto;
      }

      iframe {
        width: 100%;
        min-height: 0;
        flex: 1;
        border: 0;
        background: #090d14;
      }

      @media (max-width: 720px) {
        main {
          grid-template-rows: auto minmax(0, 1fr);
          grid-template-columns: 1fr;
        }

        aside {
          border-right: 0;
          border-bottom: 1px solid #253047;
        }

        header,
        footer {
          display: none;
        }

        nav {
          flex-direction: row;
          overflow-x: auto;
          padding: 8px;
        }

        button {
          width: auto;
          flex: 0 0 auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <aside>
        <header>
          <h1>gpui-native</h1>
          <p>Vue, React, and Svelte rendered by Zed GPUI through WebAssembly.</p>
        </header>
        <nav aria-label="Examples">
          <button data-example="market-stream">100K market stream</button>
          <button data-example="counter">Vue counter</button>
          <button data-example="react-webgpu">React WebGPU</button>
          <button data-example="webgpu">Vue WebGPU</button>
          <button data-example="svelte-counter">Svelte counter</button>
          <button data-example="svelte-showcase">Svelte showcase</button>
          <button data-example="svelte-multiple-windows">Svelte windows</button>
          <button data-example="svelte-webgpu">Svelte WebGPU</button>
          <button data-example="react-counter">React counter</button>
          <button data-example="react-showcase">React showcase</button>
          <button data-example="react-multiple-windows">React windows</button>
          <button data-example="canvas">Retained canvas</button>
          <button data-example="motion-timeline">Motion timeline</button>
          <button data-example="multiple-windows">Multiple windows</button>
          <button data-example="audio-buffer">Audio buffer</button>
        </nav>
        <footer>
          Uses WebGPU when available, with a WebGL2 fallback.<br />
          <a href="https://github.com/countradooku/gpui-native">View source on GitHub</a>
        </footer>
      </aside>
      <section>
        <div class="toolbar">
          <span>Example:</span>
          <strong id="current-example">counter</strong>
          <a id="open-example" href="./examples/counter/" target="_blank">Open separately ↗</a>
        </div>
        <iframe id="example-frame" title="gpui-native example" src="./examples/counter/"></iframe>
      </section>
    </main>
    <script type="module">
      const buttons = [...document.querySelectorAll("button[data-example]")]
      const names = new Set(buttons.map((button) => button.dataset.example))
      const frame = document.querySelector("#example-frame")
      const current = document.querySelector("#current-example")
      const open = document.querySelector("#open-example")

      function select(requested) {
        const name = names.has(requested) ? requested : "counter"
        const href = `./examples/${name}/`
        frame.src = href
        current.textContent = name
        open.href = href
        for (const button of buttons) {
          button.setAttribute("aria-current", String(button.dataset.example === name))
        }
        history.replaceState(null, "", `#${name}`)
      }

      for (const button of buttons) {
        button.addEventListener("click", () => select(button.dataset.example))
      }
      select(location.hash.slice(1))
    </script>
  </body>
</html>
