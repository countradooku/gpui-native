[workspace]
members = ["crates/gpui-vue-core"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# GPUI paint code conventionally uses compact geometry names and packed RGBA
# literals; forcing verbose spellings makes those sections harder to compare
# with upstream without improving correctness.
many_single_char_names = "allow"
unreadable_literal = "allow"
unnested_or_patterns = "allow"
