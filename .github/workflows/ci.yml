name: CI

env:
  APP_NAME: gpui-vue-native
  MACOSX_DEPLOYMENT_TARGET: "10.13"

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          components: rustfmt, clippy
          cache: false
          rustflags: ""

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan1 \
            vulkan-validationlayers

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting, lint, types, and Rust
        run: bun run check

      - name: Run unit tests
        run: bun run test

      - name: Build Vue examples with Vite and Oxc
        run: bun --filter '@gpui-vue/example-*' build

      - name: Check WebAssembly renderer
        run: cargo check --target wasm32-unknown-unknown --package gpui-vue-core --no-default-features
        env:
          RUSTC_BOOTSTRAP: "1"

  native:
    name: Native - ${{ matrix.settings.target }}
    strategy:
      fail-fast: false
      matrix:
        # Keep this list identical to `packages/gpui-vue-native/package.json`.
        # One architecture per OS avoids rebuilding the full GPUI stack for
        # targets with no demonstrated demand.
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            script: build
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            script: build:release
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            script: build
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.settings.target }}
          cache: false
          rustflags: ""

      - name: Install Metal toolchain
        if: contains(matrix.settings.target, 'apple-darwin')
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.settings.target }}

      - name: Install Linux dependencies
        if: contains(matrix.settings.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan1 \
            vulkan-validationlayers

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile all target-specific feature branches
        run: cargo check --workspace --all-features --target ${{ matrix.settings.target }}
        shell: bash

      - name: Build native binding
        run: bun --filter @gpui-native/core ${{ matrix.settings.script }} --target ${{ matrix.settings.target }}
        shell: bash

      # macOS and Windows include the target-only GPU test renderer, so their
      # generated declarations intentionally contain additional test APIs.
      - name: Verify production native declarations are current
        if: contains(matrix.settings.target, 'linux')
        run: git diff --exit-code -- packages/gpui-vue-native/index.d.ts
        shell: bash

      - name: Upload native binding
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: packages/gpui-vue-native/${{ env.APP_NAME }}.*.node
          if-no-files-found: error
          retention-days: 14

  native-smoke:
    name: Native smoke - ${{ matrix.settings.target }}
    needs:
      - quality
      - native
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download native binding
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.settings.target }}
          path: packages/gpui-vue-native

      - name: Install Linux runtime dependencies
        if: contains(matrix.settings.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 libwayland-client0 libxkbcommon-x11-0 libx11-xcb1 libvulkan1

      - name: Build Vue package
        run: bun --filter gpui-vue build

      - name: Load and exercise native binding
        run: bun run test:native

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - native-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download native bindings
        uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/*.node \
            --generate-notes \
            --title "gpui-vue $GITHUB_REF_NAME"

  publish:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - native-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package versions
        run: |
          for pkg in packages/gpui-vue packages/gpui-vue-native; do
            version=$(bun -e "console.log(require('./$pkg/package.json').version)")
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match $pkg version $version"
              exit 1
            fi
          done

      - name: Download native bindings
        uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: packages/gpui-vue-native
          merge-multiple: true

      - name: Build Vue package
        run: bun --filter gpui-vue build

      - name: Publish @gpui-native/core
        working-directory: packages/gpui-vue-native
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish gpui-vue
        working-directory: packages/gpui-vue
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
