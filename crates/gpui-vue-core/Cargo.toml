[package]
name = "gpui-vue-core"
version = "0.1.0"
edition = "2021"
description = "Full native GPUI renderer and component runtime for gpui-vue"
license = "Apache-2.0"
repository = "https://github.com/countradooku/gpui-vue"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
csscolorparser = "0.8.3"
env_logger = "0.11"
futures = "0.3"
gpui = { git = "https://github.com/remorses/zed.git", rev = "788c72f18a51363634ef984cf2e7139224f49ac2", default-features = false, features = [
  "profiler",
] }
log = "0.4"
parking_lot = "0.12"
pulldown-cmark = { version = "0.12", default-features = false }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
unicode-segmentation = "1"
web-time = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui = { git = "https://github.com/remorses/zed.git", rev = "788c72f18a51363634ef984cf2e7139224f49ac2", default-features = false, features = [
  "font-kit",
  "profiler",
] }
gpui_platform = { git = "https://github.com/remorses/zed.git", rev = "788c72f18a51363634ef984cf2e7139224f49ac2", default-features = false, features = [
  "font-kit",
  "wayland",
  "x11",
] }
napi = { version = "3", features = ["napi8", "serde-json"] }
napi-derive = "3"
syntect = { version = "5.3", default-features = false, features = ["regex-onig"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }

[target.'cfg(target_family = "wasm")'.dependencies]
syntect = { version = "5.3", default-features = false, features = ["regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
gpui_platform = { git = "https://github.com/remorses/zed.git", rev = "788c72f18a51363634ef984cf2e7139224f49ac2", default-features = false }
js-sys = "0.3"
wasm-bindgen = "=0.2.127"
web-sys = { version = "0.3", features = ["Navigator", "Window"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "=0.24.0"
core-text = "=21.0.0"
gpui_macos = { git = "https://github.com/remorses/zed.git", rev = "788c72f18a51363634ef984cf2e7139224f49ac2", default-features = false, features = [
  "font-kit",
] }

[features]
default = []
# Compatibility feature names used by the npm build scripts. The full native
# parity engine is always compiled; these names keep the CLI stable.
gpui-renderer = []
napi-bindings = []
native-window = []
test-support = [
  "gpui/test-support",
  "gpui_platform/test-support",
  "gpui_macos/test-support",
  "gpui_macos/font-kit",
]

[build-dependencies]
napi-build = "2"

[dev-dependencies]
rmp-serde = "1.3"

[lints]
workspace = true
